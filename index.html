<!doctype html>
<html lang="ru">
<script src="index.js" defer></script>

<head>
    <meta charset="UTF-8">
    <title>Выбор валюты</title>
</head>

<body>
    <label for="currency">Из какой валюты</label>
    <select id="currency">
        <option value="RUB">Рубли</option>
        <option value="USD">Доллары</option>
        <option value="EUR">Евро</option>
        <option value="KZT">Тенге</option>
    </select>
    <label for="curency">В какую валюту</label>
    <select id="curency">
        <option value="RUB">Рубли</option>
        <option value="USD">Доллары</option>
        <option value="EUR">Евро</option>
        <option value="KZT">Тенге</option>
    </select>
    <input type="text" id="input">
    <button id="show">Показать</button>
    <button id="chow">↔ </button>
    <p id="result"></p>
</body>

</html>
